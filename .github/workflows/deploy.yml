name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Publishing waits for the tests — the two workflows used to run independently, so a
  # commit with red CI landed on Pages exactly like a green one.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `test/tools/commit-messages.test.ts` judges this history, and the default
          # `fetch-depth: 1` leaves it nothing to judge: the single fetched commit is grafted,
          # so `git log --name-only` reports its WHOLE TREE as added — 488 files under
          # public/worlds/ — and every run failed with "touches data without saying scrape"
          # against a commit that touched no data. `blob:none` keeps the download small: the
          # guard reads commits and trees, and the working tree's own blobs still arrive.
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests
        run: bun test

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Shallow on purpose: this job uploads `public/` and reads no history.
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
