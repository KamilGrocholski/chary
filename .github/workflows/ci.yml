name: CI

# A push to `main` is checked by deploy.yml, which does not publish without green tests —
# so pull requests are what is left here, to avoid grinding the same thing twice.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test
