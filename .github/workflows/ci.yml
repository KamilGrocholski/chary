name: CI

# Push na `main` jest sprawdzany w deploy.yml, który bez zielonych testów nie publikuje —
# tutaj zostają pull requesty, żeby nie mielić tego samego dwa razy.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Testy
        run: bun test
