<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MargoStat — nie znaleziono</title>
  <style>
    /* Held equal to index.html's by `dashboard.test.ts` — see the note in trends.html. */
    :root {
      --bg: #0d0f12;
      --text: #e6e9ee;
      --muted: #8b94a3;
      --accent: #4c9aff;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f6f8;
        --text: #11161d;
        --muted: #5a6472;
        --accent: #1c64d8;
        color-scheme: light;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1 style="margin:0;font-size:22px">404</h1>
  <p style="margin:0;color:var(--muted)">Nie ma tu nic takiego.</p>
