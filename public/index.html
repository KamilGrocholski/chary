<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Margostat</title>
  <meta name="description" content="Statystyki graczy Margonem — rozkład poziomów i profesji w rankingach światów, migawki w czasie." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2316161a'/><rect x='6' y='17' width='4' height='9' fill='%233987e5'/><rect x='12' y='12' width='4' height='14' fill='%23199e70'/><rect x='18' y='7' width='4' height='19' fill='%23c98500'/><rect x='24' y='14' width='4' height='12' fill='%23d55181'/></svg>" />
  <script src="vendor/chart.umd.min.js"></script>
  <style>
    :root {
      /* Motyw margometera: ciepły, ciemny */
      --bg: #101013;
      --panel: #16161a;
      --surface-2: #1e1e22;
      --text: #f2f2ef;
      --muted: #a0a09a;
      --accent: #3987e5;
      --border: #35353b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    button:hover { filter: brightness(1.1); }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .reset-btn {
      border: 1px solid var(--accent);
      background: none;
      color: var(--accent);
    }

    .toolbar { margin-bottom: 20px; }
    .toolbar-row1 {
      display: grid;
      grid-template-columns: 200px 180px 1fr;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }
    .toolbar-row2 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      align-items: end;
    }
    .prof-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      padding: 6px 0;
    }
    .prof-checkboxes label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: var(--text);
      margin: 0;
      cursor: pointer;
      white-space: nowrap;
    }
    .prof-checkboxes input[type=checkbox] {
      width: auto;
      padding: 0;
      accent-color: var(--accent);
    }

    .stats {
      margin: 0 0 20px;
      color: var(--muted);
    }
    .stats-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
    }
    .chartBox { height: 420px; }
    canvas { width: 100% !important; height: 100% !important; }
    .error {
      color: #e66767;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }
    .error:empty { margin: 0; }
    .suspect {
      margin-bottom: 20px;
      border-color: #c98500;
      color: #f2f2ef;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.5;
    }
    .suspect b { color: #c98500; }
    .source {
      padding: 10px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
    }
    [hidden] { display: none !important; }

    @media (max-width: 720px) {
      .wrap { padding: 14px; }
      .toolbar-row1 { grid-template-columns: 1fr; }
      .chartBox { height: 320px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header style="display:flex;align-items:baseline;gap:10px;margin-bottom:20px;flex-wrap:wrap">
      <h1 style="margin:0;font-size:22px;letter-spacing:0.02em;font-weight:700">margostat</h1>
      <span style="color:var(--muted);font-size:13px">statystyki graczy Margonem</span>
    </header>

    <div class="card toolbar">
      <div class="toolbar-row1">
        <div>
          <label for="worldSelect">Świat</label>
          <select id="worldSelect"></select>
        </div>
        <div>
          <label for="snapshotSelect">Data</label>
          <select id="snapshotSelect"></select>
        </div>
        <div>
          <label>Plik</label>
          <div style="display:flex;align-items:center;gap:8px">
            <div id="sourceInfo" class="source">—</div>
            <button id="copyBtn" title="Kopiuj link do tego widoku" style="width:auto;padding:4px 8px;font-size:13px;background:#1e1e22;color:var(--accent);border:1px solid var(--border);flex-shrink:0">⎘</button>
          </div>
        </div>
      </div>

      <div class="toolbar-row2">
        <div>
          <label for="minLevel">Min level</label>
          <input id="minLevel" type="number" placeholder="np. 1" min="1" />
        </div>
        <div>
          <label for="maxLevel">Max level</label>
          <input id="maxLevel" type="number" placeholder="np. 400" min="1" />
        </div>
        <div>
          <label for="minHonor">Min honor</label>
          <input id="minHonor" type="number" placeholder="np. -100" />
        </div>
        <div>
          <label for="maxHonor">Max honor</label>
          <input id="maxHonor" type="number" placeholder="np. 99999" />
        </div>
        <div style="grid-column: span 2">
          <label for="onlineValue">Ostatnio online (maks. dni)</label>
          <div style="display:flex;gap:6px">
            <input id="onlineValue" type="number" value="" min="0" step="1" placeholder="wszyscy" style="flex:1;min-width:0" />
            <select id="onlinePreset" aria-label="Gotowe progi aktywności" style="width:auto">
              <option value="all">Wszyscy</option>
              <option value="0">&lt; 24h</option>
              <option value="1">1 dzień</option>
              <option value="3">3 dni</option>
              <option value="7">7 dni</option>
              <option value="14">14 dni</option>
              <option value="30">30 dni</option>
            </select>
          </div>
        </div>
        <div style="grid-column: 1 / -1">
          <label>Profesja</label>
          <div class="prof-checkboxes" id="profCheckboxes"></div>
        </div>
        <div>
          <button id="resetBtn" class="reset-btn">Resetuj filtry</button>
        </div>
      </div>
    </div>

    <div id="suspect" class="suspect card" role="status" hidden></div>

    <div class="stats card" id="stats">Ładowanie…</div>
    <div id="error" class="error" role="alert"></div>

    <div class="card chartBox">
      <div id="chartEmpty" class="empty" hidden>Brak graczy spełniających filtry.</div>
      <canvas id="professionChart"></canvas>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
