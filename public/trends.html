<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MargoStat — trendy</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2314171c'/><rect x='6' y='17' width='4' height='9' fill='%233987e5'/><rect x='12' y='12' width='4' height='14' fill='%23199e70'/><rect x='18' y='7' width='4' height='19' fill='%23c98500'/><rect x='24' y='14' width='4' height='12' fill='%23d55181'/></svg>" />
  <style>
    /* The fourth copy of the palette — there is no CSS build step and index.html's block has
       to stay inline, so the three pages cannot share one. `dashboard.test.ts` holds these
       equal to index.html's, because a copy nobody compares is a copy that drifts. */
    :root {
      --bg: #0d0f12;
      --text: #e6e9ee;
      --muted: #8b94a3;
      --accent: #4c9aff;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f4f6f8;
        --text: #11161d;
        --muted: #5a6472;
        --accent: #1c64d8;
        color-scheme: light;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 24px;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <!-- A world's history no longer lives on a page of its own: the snapshot cross-section
       and the history stand under one filter in index.html. This page remains for one
       reason only — so links shared earlier keep working. The two views' parameter sets
       never collided (`world/date/prog/udzial` against `minLevel/…/prof`), so the query
       string carries over whole and lands in the same view state. -->
  <p>
    Trendy są teraz częścią <a id="target" href="index.html">widoku świata</a>.<br />
    Za chwilę nastąpi przekierowanie.
  </p>
  <script>
    var target = "index.html" + location.search + location.hash;
    document.getElementById("target").href = target;
    location.replace(target);
  </script>
</body>
</html>
