    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;

<body>
  <!-- Historia świata nie mieszka już na osobnej stronie: przekrój migawki i historia
       stoją pod jednym filtrem w index.html. Ta strona zostaje wyłącznie po to, żeby
       linki rozesłane wcześniej dalej działały — zestawy parametrów obu widoków nigdy
       nie kolidowały (`world/date/prog/udzial` wobec `minLevel/…/prof`), więc query
       string przenosi się w całości i ląduje w tym samym stanie widoku. -->
  <p>
    Trendy są teraz częścią <a id="target" href="index.html">widoku świata</a>.<br />
    Za chwilę nastąpi przekierowanie.
  </p>
  <script>
    var target = "index.html" + location.search + location.hash;
    document.getElementById("target").href = target;
    location.replace(target);
  </script>
</body>
